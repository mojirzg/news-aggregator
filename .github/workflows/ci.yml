name: CI

on:
  push:
  pull_request:

env:
  CI: 'true'
  NEWS_PROVIDER_MODE: mock

jobs:
  quality:
    name: Lint, types, unit tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Record commit metadata
        run: |
          mkdir -p quality-gate
          printf '{"commitSha":"%s","job":"quality","providerMode":"mock"}\n' "$GITHUB_SHA" > quality-gate/metadata.json
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee quality-gate/install.log
      - name: Lint
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee quality-gate/lint.log
      - name: Type check
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee quality-gate/typecheck.log
      - name: Run unit tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee quality-gate/unit-tests.log
      - name: Build production bundles
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee quality-gate/build.log
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - name: Upload source quality-gate record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-source-${{ github.sha }}
          path: quality-gate/
          if-no-files-found: error

  browser:
    name: Playwright desktop and mobile
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Record commit metadata
        run: |
          mkdir -p quality-gate
          printf '{"commitSha":"%s","job":"browser","providerMode":"mock"}\n' "$GITHUB_SHA" > quality-gate/metadata.json
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee quality-gate/install.log
      - name: Install Playwright browser
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee quality-gate/playwright-install.log
      - name: Run end-to-end tests
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee quality-gate/playwright.log
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
      - name: Upload browser quality-gate record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-browser-${{ github.sha }}
          path: quality-gate/
          if-no-files-found: error

  container:
    name: Docker build, Compose, and health
    needs: [quality, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record commit metadata
        run: |
          mkdir -p quality-gate
          printf '{"commitSha":"%s","job":"container","providerMode":"mock","image":"news-aggregator:%s"}\n' "$GITHUB_SHA" "$GITHUB_SHA" > quality-gate/metadata.json
      - name: Build Docker image
        run: |
          set -o pipefail
          docker build --tag "news-aggregator:${GITHUB_SHA}" . 2>&1 | tee quality-gate/docker-build.log
      - name: Run Docker Compose
        env:
          NEWS_AGGREGATOR_IMAGE: news-aggregator:${{ github.sha }}
        run: |
          set -o pipefail
          docker compose up -d --no-build 2>&1 | tee quality-gate/docker-compose-up.log
      - name: Verify healthy container
        env:
          NEWS_AGGREGATOR_IMAGE: news-aggregator:${{ github.sha }}
        run: |
          set -o pipefail
          container_id="$(docker compose ps -q news-aggregator)"
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            printf 'attempt=%s status=%s\n' "$attempt" "$status" | tee -a quality-gate/health.log
            if [ "$status" = healthy ]; then
              curl --fail --silent --show-error http://127.0.0.1:3000/api/health | tee quality-gate/health-response.json
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color | tee quality-gate/docker-compose.log
          exit 1
      - name: Capture container state
        if: always()
        env:
          NEWS_AGGREGATOR_IMAGE: news-aggregator:${{ github.sha }}
        run: |
          docker compose ps --format json > quality-gate/docker-compose-ps.json || true
          container_id="$(docker compose ps -q news-aggregator 2>/dev/null || true)"
          if [ -n "$container_id" ]; then
            docker inspect "$container_id" > quality-gate/docker-inspect.json || true
            docker compose logs --no-color > quality-gate/docker-compose.log || true
          fi
      - name: Stop Docker Compose
        if: always()
        env:
          NEWS_AGGREGATOR_IMAGE: news-aggregator:${{ github.sha }}
        run: docker compose down --volumes || true
      - name: Upload container quality-gate record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-container-${{ github.sha }}
          path: quality-gate/
          if-no-files-found: error
