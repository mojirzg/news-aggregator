container:
  name: Docker build, Compose, and health
  needs:
    - quality
    - browser
  runs-on: ubuntu-latest

  env:
    NODE_ENV: production
    NEWS_PROVIDER_MODE: mock
    HOST_PORT: '3000'
    CONTAINER_PORT: '3000'
    GUARDIAN_API_KEY: ''
    NYT_API_KEY: ''
    NEWS_API_KEY: ''

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Record commit metadata
      run: |
        mkdir -p quality-gate
        printf '{"commitSha":"%s","job":"container","providerMode":"mock"}\n' \
          "$GITHUB_SHA" > quality-gate/metadata.json

    - name: Validate Compose configuration
      run: |
        set -o pipefail
        docker compose config 2>&1 \
          | tee quality-gate/docker-compose-config.log

    - name: Build and start Docker Compose
      run: |
        set -o pipefail
        docker compose up --build --detach 2>&1 \
          | tee quality-gate/docker-compose-up.log

    - name: Verify healthy container
      run: |
        set -o pipefail

        container_id="$(docker compose ps --quiet app)"

        if [ -z "$container_id" ]; then
          echo "Compose did not create the app container."
          docker compose ps
          docker compose logs --no-color
          exit 1
        fi

        for attempt in $(seq 1 30); do
          status="$(
            docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
              "$container_id"
          )"

          printf 'attempt=%s status=%s\n' \
            "$attempt" \
            "$status" \
            | tee -a quality-gate/health.log

          if [ "$status" = "healthy" ]; then
            curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:3000/api/health \
              | tee quality-gate/health-response.json

            exit 0
          fi

          if [ "$status" = "unhealthy" ]; then
            echo "Container became unhealthy."
            docker compose logs --no-color \
              | tee quality-gate/docker-compose.log
            exit 1
          fi

          sleep 2
        done

        echo "Container did not become healthy before timeout."
        docker compose ps
        docker compose logs --no-color \
          | tee quality-gate/docker-compose.log
        exit 1

    - name: Capture container state
      if: always()
      run: |
        docker compose ps --format json \
          > quality-gate/docker-compose-ps.json || true

        container_id="$(
          docker compose ps --quiet app 2>/dev/null || true
        )"

        if [ -n "$container_id" ]; then
          docker inspect "$container_id" \
            > quality-gate/docker-inspect.json || true
        fi

        docker compose logs --no-color \
          > quality-gate/docker-compose.log || true

        docker image ls \
          > quality-gate/docker-images.log || true

    - name: Stop Docker Compose
      if: always()
      run: docker compose down --volumes --remove-orphans || true

    - name: Upload container quality-gate record
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-gate-container-${{ github.sha }}
        path: quality-gate/
        if-no-files-found: error
